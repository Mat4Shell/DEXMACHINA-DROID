name: Fuzz

# Nightly fuzzing of the parsers. Never triggered by pull requests and not a
# required check: a finding shows up as a failed run in the Actions tab.

on:
  push:
    branches: [ci/nightly-fuzz]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds (at most 2700)
        type: number
        default: 1500

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Dated nightly and cargo-fuzz version, updated by hand like cargo-deny.
  FUZZ_TOOLCHAIN: nightly-2026-11-26
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: droid-archive
            target: zip_archive
            dict: zip.dict
            max_len: 70000
    env:
      CRATE: ${{ matrix.crate }}
      TARGET: ${{ matrix.target }}
      DICT: ${{ matrix.dict }}
      MAX_LEN: ${{ matrix.max_len }}
      FUZZ_DIR: crates/${{ matrix.crate }}/fuzz
      FUZZ_SECONDS: ${{ inputs.seconds || 1500 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the fuzzing time
        run: |
          if ! [[ "$FUZZ_SECONDS" =~ ^[0-9]+$ ]] || (( FUZZ_SECONDS < 1 || FUZZ_SECONDS > 2700 )); then
            echo "::error::seconds must be an integer between 1 and 2700"
            exit 1
          fi

      - name: Install the Rust toolchains
        run: |
          rustup toolchain install
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal

      - name: Install cargo-fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FUZZ_DIR }}/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Add the seeds generated by the integration tests
        run: |
          corpus="$GITHUB_WORKSPACE/$FUZZ_DIR/corpus/$TARGET"
          mkdir -p "$corpus"
          echo "Corpus restored from the cache: $(find "$corpus" -type f | wc -l) files"
          DROID_FUZZ_SEEDS_DIR="$corpus" cargo test -p "$CRATE" --test fuzz_seeds --locked \
            -- --ignored --exact write_fuzz_seeds
          echo "Corpus with the seeds: $(find "$corpus" -type f | wc -l) files"

      - name: Build the fuzzing target
        working-directory: ${{ env.FUZZ_DIR }}
        run: |
          cargo +"$FUZZ_TOOLCHAIN" fetch --locked
          cargo +"$FUZZ_TOOLCHAIN" fuzz build "$TARGET"

      - name: Fuzz
        working-directory: ${{ env.FUZZ_DIR }}
        run: |
          cargo +"$FUZZ_TOOLCHAIN" fuzz run "$TARGET" "corpus/$TARGET" -- \
            -dict="$DICT" -max_len="$MAX_LEN" -max_total_time="$FUZZ_SECONDS" \
            -fork="$(nproc)" -ignore_crashes=0 -ignore_timeouts=0 -ignore_ooms=0 \
            -rss_limit_mb=2048 -timeout=10 -print_final_stats=1

      - name: Minimize the corpus
        working-directory: ${{ env.FUZZ_DIR }}
        run: |
          cargo +"$FUZZ_TOOLCHAIN" fuzz cmin "$TARGET" "corpus/$TARGET" -- \
            -dict="$DICT" -max_len="$MAX_LEN" -rss_limit_mb=2048 -timeout=10
          files=$(find "corpus/$TARGET" -type f | wc -l)
          size=$(du -sh "corpus/$TARGET" | cut -f1)
          echo "Corpus after minimization: $files files, $size"
          echo "Corpus of \`$TARGET\` after minimization: $files files, $size." >> "$GITHUB_STEP_SUMMARY"

      - name: Show the failing inputs
        if: failure()
        working-directory: ${{ env.FUZZ_DIR }}
        run: |
          shopt -s nullglob
          inputs=("artifacts/$TARGET"/*)
          if (( ${#inputs[@]} == 0 )); then
            echo "No failing input was saved."
            exit 0
          fi
          {
            echo "## Failing inputs for \`$TARGET\`"
            echo
            echo "Decode one with \`base64 -d > input\`, then reproduce it with"
            echo "\`cargo +$FUZZ_TOOLCHAIN fuzz run $TARGET input\` from \`$FUZZ_DIR\`."
          } >> "$GITHUB_STEP_SUMMARY"
          for input in "${inputs[@]}"; do
            name=$(basename "$input")
            echo "$name: $(stat -c %s "$input") bytes, sha256 $(sha256sum "$input" | cut -d' ' -f1)"
            base64 -w 76 "$input"
            {
              echo
              echo "<details><summary>$name ($(stat -c %s "$input") bytes)</summary>"
              echo
              echo '```'
              base64 -w 76 "$input"
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done
